git:
  pagers:
    - colorArg: always
      pager: delta --paging=never
customCommands:
  - key: b
    context: files
    description: Blame file
    command: git blame -- {{.SelectedFile.Name | quote}}
    output: terminal
  - key: b
    context: commitFiles
    description: Blame file at this commit
    command: git blame {{.SelectedCommit.Hash}} -- {{.SelectedCommitFile.Name | quote}}
    output: terminal
